<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reynolds Flow — Interactive Demo</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Canvas CFD 2D -->
    <div id="canvas-container"></div>
    
    <!-- Overlay UI -->
    <div id="ui-overlay">
        <!-- Header -->
        <header id="header">
            <h1>Reynolds Flow</h1>
            <p class="subtitle">Flow Regime Visualization</p>
        </header>
        
        <!-- Control Panel -->
        <aside id="control-panel">
            <div class="panel-header">
                <h2>Parameters</h2>
                <div id="connection-status" class="status-dot disconnected" title="WebSocket"></div>
            </div>
            
            <!-- Presets -->
            <div class="control-group presets">
                <label>Fluid</label>
                <div class="preset-buttons">
                    <button class="preset-btn" data-preset="water">Water</button>
                    <button class="preset-btn" data-preset="oil">Oil</button>
                    <button class="preset-btn" data-preset="air">Air</button>
                    <button class="preset-btn" data-preset="honey">Honey</button>
                </div>
            </div>
            
            <!-- Sliders -->
            <div class="control-group">
                <label for="velocity">
                    Velocity <span class="symbol">v</span>
                    <span class="value" id="velocity-value">1.00 m/s</span>
                </label>
                <input type="range" id="velocity" min="0.01" max="10" step="0.01" value="1">
            </div>
            
            <div class="control-group">
                <label for="diameter">
                    Diameter <span class="symbol">D</span>
                    <span class="value" id="diameter-value">0.10 m</span>
                </label>
                <input type="range" id="diameter" min="0.01" max="1" step="0.01" value="0.1">
            </div>
            
            <div class="control-group">
                <label for="density">
                    Density <span class="symbol">ρ</span>
                    <span class="value" id="density-value">1000 kg/m³</span>
                </label>
                <input type="range" id="density" min="0.5" max="2000" step="1" value="1000">
            </div>
            
            <div class="control-group">
                <label for="viscosity">
                    Viscosity <span class="symbol">μ</span>
                    <span class="value" id="viscosity-value">0.001 Pa·s</span>
                </label>
                <input type="range" id="viscosity" min="0.00001" max="5" step="0.00001" value="0.001">
            </div>
        </aside>
        
        <!-- Results Panel -->
        <div id="results-panel">
            <div class="result-card reynolds">
                <span class="result-label">Reynolds Number</span>
                <span class="result-value" id="reynolds-value">—</span>
            </div>
            
            <div class="result-card regime">
                <span class="result-label">Regime</span>
                <span class="result-badge" id="regime-badge">—</span>
            </div>
            
            <div class="regime-bar-container">
                <div class="regime-bar">
                    <div class="regime-zone laminar">Laminar</div>
                    <div class="regime-zone transition">Transition</div>
                    <div class="regime-zone turbulent">Turbulent</div>
                </div>
                <div class="regime-indicator" id="regime-indicator"></div>
            </div>
        </div>
        
        <!-- Formula -->
        <div id="formula-panel">
            <div class="formula">
                Re = <span class="frac"><span class="num">ρ · v · D</span><span class="den">μ</span></span>
            </div>
        </div>
        
        <!-- Instructions -->
        <div id="instructions">
            <p>CFD 2D rendering: streaks = velocity, chaos = turbulence. Adjust v, D, ρ, μ.</p>
        </div>
    </div>
    
    <!-- Scripts -->
    <script type="module" src="/js/app.js?v=20260113i"></script>
</body>
</html>
